name = pctalker
summary = "PC-TALKER (Király József, 1990-1991)"
description = """Három magyar beszédszintetizátor Király Józseftől, az eredeti DOS-motorokkal, a Unicorn CPU-emulátorban, az NVDA saját folyamatán belül futtatva. Nincs DOSBox és nincs külső program.

Hangként választható, a keletkezésük sorrendjében:

READSPF (1990) — a legkorábbi változat, PC-hangszóróra. Közvetlenül a standard inputról olvas, és a számokat magától kimondja. Ez az egyetlen kiadás, amelyet a szerző nem írt át Pythonra: máshol nem fut, csak itt.

SPEAKER 1.0 (1991) — szintén PC-hangszórós, hangkártya nélkül: az amplitúdó impulzusszélességgé válik a 8253 időzítő 2-es csatornáján. Kereskedelmi forgalomba soha nem került.

PC-TALKER 5.01 (1991) — a Sound Blaster-es változat, a rezidens meghajtó memóriaképéből futtatva. Halvány térhatás hallható benne: a HANG rutin körkörös pufferén át a késleltetett jel visszakerül a bemenetre, és rekurzívan halkul. Ez a motor sajátja, nem a bővítményé. Ez az alapértelmezett hang.

A két hangszórós hang egy szűrőn megy át, amely a kis belső hangszóró viselkedését modellezi: 4200 Hz-es aluláteresztő és 400 Hz-es felüláteresztő. Egy valódi membránnak tömege van — nem tudta követni azokat az ugrásokat, amelyeket a mai hangkártya hibátlanul lejátszik, és mélye sem volt. A nyers minták visszaadása ezért nem hűbb, hanem kevésbé hű. A szerző döntése alapján, 2026 augusztusában.

Ez a bővítmény referencia: az eredeti 1990-91-es programokat futtatja, bájtról bájtra, hogy meg lehessen nézni, mit csináltak valójában. A két hangszórós hang lassabb — körülbelül 1,7-szeres előnyt tart a lejátszással szemben —, ezért gyengébb gépen vagy hosszú felolvasásnál szaggathat. Napi olvasáshoz a szerző saját, 2026-ban Pythonban újraírt bővítményeit ajánljuk (PCTALKER Printer, PC Speaker, Sound Blaster): azok nem emulálnak semmit, és azonnal válaszolnak.

Király József 1987-ben kezdte a PC-TALKER-t, a beszédelemeket a saját hangjáról készült 8 kHz-es felvételekből vágta ki. 1988-ban mutatta be a budapesti vásáron, nyomtatóportra kötött átalakítóval. Forgalmazta a Technorecord, a Műszertechnika és az SZKI Recognita. A szerző kifejezett engedélyével, 2026 augusztusában.

A sebesség újramintavételezéssel készül, ezért a hangmagasság együtt mozog vele. A szerző szerint az eredeti programokban is így működött az intonáció vezérlése."""
